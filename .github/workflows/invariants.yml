# The structural invariant that no Go guard holds, as a pattern a machine
# refuses.
#
# Issue #76 named five structural rules and asked that each become a pattern
# rule here. Four of the five are settled somewhere other than a pattern, and
# this file holds the fifth. Which property is refused by what:
#
#   no direct clock read in the orchestration packages
#       internal/orchestration/clock_guard_test.go,
#       TestNothingInOrchestrationReadsTheClockDirectly
#   no media plane import in the orchestration packages
#       internal/orchestration/import_graph_test.go,
#       TestOrchestrationDoesNotReachTheMediaPlane
#   no permission decision outside the one function
#       internal/orchestration/permission_guard_test.go,
#       TestOnlyOnePlaceDecidesAPermission
#   no logging outside the one surface
#       this file, rule logging-outside-the-log-surface
#   no direct device call from the client logic package
#       nothing yet; the package does not exist and #58 is where the platform
#       is chosen
#
# The first three were pattern rules in this file as well, until #76 was taken.
# Two mechanisms for one property drift: the day the syntax-tree guard is
# widened, the pattern beside it goes on refusing the old set and nobody reads
# both. So the stronger of the two keeps the property and the weaker one is
# gone, and each of the three is stronger for a reason of its own rather than
# by preference. The import guard asks the toolchain for the dependency graph,
# so an import arriving through a third package is caught exactly like a direct
# one, and a pattern over source cannot see a transitive import at all. The
# permission guard parses each file and walks the syntax tree, refusing a call
# to Granted or to has while allowing a declaration of Granted, which is how a
# test supplies grants; a pattern cannot tell a call from a declaration. The
# clock guard is the one closest to a pattern, and it still covers the tests as
# well as the code under them and fails closed on an empty file list.
#
# What this file gave up in that trade is real and is worth reading before
# somebody moves a rule back. A Go guard lives in the package it judges, so it
# stops covering the tree the moment the work lands somewhere else and nothing
# says so. A pattern rule is keyed on a path prefix and so reaches a package
# nobody has written yet. That reach is now held for the logging rule alone,
# which is the rule whose subject is the whole of internal/ rather than one
# package.
#
# The device rule has no subject. No client platform has been chosen, the
# package does not exist, and the call such a rule would refuse is named by the
# platform, so a pattern written now would name an API nobody picked and would
# never fire. #58 is where the platform is chosen; the rule belongs to
# whichever change first creates that package, where the fixture proving it
# bites can be the real thing.
#
# The rules are data. They sit in the block below, one stanza each, and the
# code under them applies whatever is in that block and decides nothing itself.
# Issue #76 declares `Scope: .github/workflows/`, so a configuration file
# beside the two scripts in `.github/` would be a path outside it, and the
# block is in this file for that reason rather than because a data file would
# be worse.
#
# Every rule ships two fixtures and the run refuses a rule missing either. The
# fixture that has to bite is the near miss rather than an obvious violation:
# `fmt.Errorf` beside `fmt.Print`. Each rule is also run against a file outside
# its own paths, and against its own exempt paths where it has any, so a rule
# that fires everywhere fails here rather than in somebody's unrelated change.
#
# A rule whose paths hold no file today says so in the run and passes. That is
# how a rule written before the code it covers reads, and printing it is what
# stops a green run being read as a rule that found nothing. It is not a way in
# for a rule with no subject: such a rule cannot plant a fixture that bites
# under a path that exists, which is what the proof above the tree scan asks of
# every rule before the tree is judged at all.
#
# Hardened the same way as every other workflow here: read-only permissions at
# the top level, every action pinned by commit with a version comment, and
# checkout without persisted credentials.

name: Invariants

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the job reads the tree and writes nothing back.
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one. Nothing here
# publishes, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run name is "Greppable invariants" and it is the literal name a
  # required status check would have to carry. Renaming this job renames the
  # check run and silently detaches it from any rule that requires it. Issue #25
  # is where that rule is asked for, and this comment is the record of the name
  # it would have to name.
  invariants:
    name: Greppable invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove every rule bites, then scan the tree
        run: |
          set -eu

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # ---- the rules ----------------------------------------------------
          #
          # One stanza per rule, separated by a blank line. Every field is
          # required except `exempt`, which may be empty.
          #
          #   rule     the identifier, and the name a refusal is reported under
          #   paths    the path prefix the rule applies to
          #   files    the filename glob inside those paths
          #   exempt   path prefixes the rule does not apply to, comma separated
          #   pattern  an extended regular expression; a match is a refusal
          #   why      the failure the rule prevents
          #   bites    a line the rule has to refuse
          #   allows   a line it has to leave alone, chosen to be the near miss

          cat > "$work/rules.conf" <<'RULES'
          rule: logging-outside-the-log-surface
          paths: internal/
          files: *.go
          exempt: internal/logging/logging.go
          pattern: (^|[^[:alnum:]_.])(log|slog)\.[A-Z]|(^|[^[:alnum:]_.])fmt\.(Print|Fprint)|(^|[^[:alnum:]_.])println\(
          why: a log that carries no conversation content is only checkable where there is one place logs are written. A package printing for itself is a second surface nobody reviewed. The exempt file is that surface, from issue #67, and it is one file rather than the package so that a second writer arriving beside it is refused here.
          bites: 	log.Printf("member %s joined %s", m.Name, ch.Name)
          allows: 	return fmt.Errorf("member %s is not in channel %s", m.ID, ch.ID)
          RULES

          # ---- reading the rules --------------------------------------------

          mkdir "$work/rules"
          awk -v dir="$work/rules" '
            /^rule: /       { n++; file = sprintf("%s/%03d", dir, n) }
            n && NF && $0 !~ /^#/ { print > file }
          ' "$work/rules.conf"

          if [ -z "$(ls -A "$work/rules")" ]; then
            echo "REFUSED: the rule block parsed to no rules at all"
            exit 1
          fi

          # Everything after the first "key: " on its own line, so a pattern
          # keeps its own spaces and its own colons.
          field() {
            sed -n "s/^$2: //p; s/^$2:\$//p" "$1" | head -n 1
          }

          # ---- applying one rule --------------------------------------------
          #
          # One code path judges the tree and the fixtures alike. What differs
          # between them is the root it is pointed at, which is why the fixtures
          # are laid out as real files under real paths rather than fed in as
          # text.

          apply() {
            apply_root=$1
            apply_rule=$2

            a_paths=$(field "$apply_rule" paths)
            a_files=$(field "$apply_rule" files)
            a_exempt=$(field "$apply_rule" exempt)
            a_pattern=$(field "$apply_rule" pattern)

            : > "$work/hits"
            if [ ! -e "$apply_root/$a_paths" ]; then
              return 0
            fi

            find "$apply_root/$a_paths" -type f -name "$a_files" \
              | sed "s|^$apply_root/||" | sort > "$work/candidates"

            : > "$work/hits"
            printf '%s\n' "$a_exempt" | tr ',' '\n' | tr -d '[:blank:]' > "$work/ex"
            while read -r rel; do
              skip=0
              while read -r ex; do
                [ -n "$ex" ] || continue
                ex=${ex%/}
                case "$rel" in
                  "$ex"|"$ex"/*) skip=1 ;;
                esac
              done < "$work/ex"
              [ "$skip" -eq 0 ] || continue
              grep -nE "$a_pattern" "$apply_root/$rel" \
                | sed "s|^|$rel:|" >> "$work/hits" || true
            done < "$work/candidates"

            [ ! -s "$work/hits" ]
          }

          # ---- the proof, run before the tree is judged ---------------------

          proof_failures=0

          plant() {
            plant_dir=$(dirname "$1/$2")
            mkdir -p "$plant_dir"
            printf '%s\n' "$3" > "$1/$2"
          }

          expect() {
            want=$1
            root=$2
            rulefile=$3
            what=$4
            if apply "$root" "$rulefile" > /dev/null 2>&1; then
              got=allowed
            else
              got=refused
            fi
            if [ "$got" = "$want" ]; then
              printf '  proved %s: %s\n' "$want" "$what"
            else
              printf '  PROOF FAILED: %s was %s, and it is %s\n' "$id" "$got" "$what"
              proof_failures=1
            fi
          }

          for rulefile in "$work"/rules/*; do
            id=$(field "$rulefile" rule)
            paths=$(field "$rulefile" paths)
            files=$(field "$rulefile" files)
            exempt=$(field "$rulefile" exempt)
            pattern=$(field "$rulefile" pattern)
            why=$(field "$rulefile" why)
            bites=$(field "$rulefile" bites)
            allows=$(field "$rulefile" allows)

            echo "$id"

            missing=
            [ -n "$paths" ]   || missing="$missing paths"
            [ -n "$files" ]   || missing="$missing files"
            [ -n "$pattern" ] || missing="$missing pattern"
            [ -n "$why" ]     || missing="$missing why"
            [ -n "$bites" ]   || missing="$missing bites"
            [ -n "$allows" ]  || missing="$missing allows"
            if [ -n "$missing" ]; then
              printf '  PROOF FAILED: the rule declares no%s, so nothing here shows it bites\n' "$missing"
              proof_failures=1
              continue
            fi

            # The name is derived from the rule's own glob so a rule over
            # something other than Go source proves itself the same way.
            leaf=$(printf '%s' "$files" | sed 's/^\*//')
            [ -n "$leaf" ] || leaf=.fixture
            fx="$work/fx/$id"
            rm -rf "$fx"

            plant "$fx/bites"   "$paths/near_miss$leaf"     "$bites"
            plant "$fx/allows"  "$paths/near_miss$leaf"     "$allows"
            plant "$fx/outside" "elsewhere/near_miss$leaf"  "$bites"

            expect refused "$fx/bites"   "$rulefile" "the line the rule is about"
            expect allowed "$fx/allows"  "$rulefile" "the near miss beside it"
            expect allowed "$fx/outside" "$rulefile" "the same line outside the rule's paths"

            if [ -n "$exempt" ]; then
              first_exempt=$(printf '%s' "$exempt" | cut -d, -f1 | tr -d '[:blank:]')
              plant "$fx/exempt" "$first_exempt" "$bites"
              # Everything the rule covers other than the exempt path has to
              # stay covered, so the exempt tree carries the violation twice and
              # only one of the two is forgiven.
              expect allowed "$fx/exempt" "$rulefile" "the same line inside $first_exempt"
              plant "$fx/exempt-neighbour" "$first_exempt" "$bites"
              plant "$fx/exempt-neighbour" "$paths/near_miss$leaf" "$bites"
              expect refused "$fx/exempt-neighbour" "$rulefile" "a neighbour of the exempt file, which the exemption may not reach"
            fi
          done

          if [ "$proof_failures" -ne 0 ]; then
            echo
            echo "REFUSED: a rule did not prove it can say no, so the tree is not judged"
            exit 1
          fi

          # ---- the tree -----------------------------------------------------

          echo
          echo "judging ."
          failed=0
          for rulefile in "$work"/rules/*; do
            id=$(field "$rulefile" rule)
            paths=$(field "$rulefile" paths)
            files=$(field "$rulefile" files)
            why=$(field "$rulefile" why)

            if [ ! -e "./$paths" ]; then
              printf '  not asked: %s covers %s, which this tree does not hold yet\n' "$id" "$paths"
              continue
            fi
            count=$(find "./$paths" -type f -name "$files" | wc -l | tr -d '[:blank:]')

            if apply "." "$rulefile"; then
              printf '  ok        %s over %s file(s) under %s\n' "$id" "$count" "$paths"
            else
              printf '  REFUSED   %s over %s file(s) under %s\n' "$id" "$count" "$paths"
              sed 's/^/              /' "$work/hits"
              printf '            %s\n' "$why"
              failed=1
            fi
          done

          exit "$failed"
