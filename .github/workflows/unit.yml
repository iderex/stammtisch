# The unit suite, on a runner that has nothing.
#
# Headless testability is a birth requirement on this board, and a requirement
# with no check is a preference. The moment one test needs a sound device, a
# display or a raised privilege, the suite stops running on a clean runner and
# the discipline unwinds quietly, one test at a time, with nobody noticing until
# the whole suite only runs on the machine it was written on.
#
# So the constraint is enforced by where the suite runs rather than by a rule in
# a document. This job runs the whole suite on a stock runner with no display
# server, no audio device and no elevation, and it asserts those absences before
# it runs anything rather than assuming them. A test that needs any of the three
# fails here, which is the point.
#
# It also counts what it ran. A suite that silently executed nothing exits zero
# exactly like a suite that ran and passed, and the count is the only thing that
# tells those two apart.
#
# Hardened the same way as every other workflow here: read-only permissions at
# the top level, every action pinned by commit with a version comment, and
# checkout without persisted credentials.
name: Unit

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the job runs tests and writes nothing back.
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one. Nothing here
# publishes, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run name is "Unit" and it is the literal name a required status
  # check would have to carry. Renaming this job renames the check run and
  # silently detaches it from any rule that requires it. Issue #25 is where
  # that rule is asked for.
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The floor comes from go.mod rather than from a number written here,
          # so the toolchain the gate uses cannot drift from the one the module
          # declares.
          go-version-file: go.mod

      # This step is why the job is evidence rather than a hope. It prints what
      # it found before it judges it, so a reader can see the environment the
      # suite then ran in rather than trusting that it was bare.
      #
      # /dev/dri is reported and not refused, and the difference is deliberate.
      # The stock runner carries a render node: the first run of this job
      # refused it and went red on a runner that had no display server at all.
      # A render node is not a display server, nothing can draw to it without
      # one, and a check that refuses the runner this board has chosen is a
      # check nobody can satisfy.
      - name: Prove the runner has no display, no audio device and no elevation
        run: |
          set -uo pipefail
          echo "uid=$(id -u) user=$(id -un)"
          echo "DISPLAY='${DISPLAY:-}'"
          echo "WAYLAND_DISPLAY='${WAYLAND_DISPLAY:-}'"
          ls -d /dev/snd 2>/dev/null || echo "/dev/snd: absent"
          ls -d /dev/dri 2>/dev/null || echo "/dev/dri: absent (reported, not refused)"
          fail=0
          note() { echo "REFUSED: $1"; fail=1; }
          [ -z "${DISPLAY:-}" ] || note "DISPLAY is set, so a test needing a display would pass here and fail on a clean runner"
          [ -z "${WAYLAND_DISPLAY:-}" ] || note "WAYLAND_DISPLAY is set, same reason"
          [ ! -e /dev/snd ] || note "an audio device is present, so a test needing one would pass here and fail on a clean runner"
          [ "$(id -u)" != "0" ] || note "the job is running as uid 0, and the suite has to pass unprivileged"
          exit "$fail"

      # The count is taken from the verbose log rather than from a structured
      # report, so the same three commands can be run on a workstation and give
      # the same three numbers. Subtests are counted, because a subtest is a
      # test that ran.
      - name: Run the unit suite and count what it ran
        run: |
          set -u
          set -o pipefail
          # The step shell is started with -e. That is turned off here on
          # purpose: a red suite has to reach the count and the exit code below
          # rather than aborting at the line that produced it, and `grep -c`
          # exits non-zero on a count of zero, which is the ordinary case for
          # the failed and skipped tallies.
          set +e
          started=$SECONDS
          go test -count=1 -v ./... 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          invocation=$((SECONDS - started))
          passed=$(grep -cE '^[[:space:]]*--- PASS: ' test-output.txt)
          failed=$(grep -cE '^[[:space:]]*--- FAIL: ' test-output.txt)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP: ' test-output.txt)
          total=$((passed + failed + skipped))
          echo "tests executed: $total (passed $passed, failed $failed, skipped $skipped)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$total" -eq 0 ]; then
            echo "REFUSED: the suite reported no tests at all, and a run that executed nothing is not a run that passed"
            exit 1
          fi

          # ---- how long the suite itself took -------------------------------
          #
          # WHAT IS JUDGED IS THE TEST EXECUTION AND NOT THE INVOCATION AROUND
          # IT, and until #170 it was the invocation. `go test` compiles every
          # package before it runs one, and fetches what the module cache is
          # missing, so the wall clock around it moves by ten seconds and more
          # between two runs that executed the same tests. Four runs of this
          # job, the invocation against the sum of the per-package times
          # `go test` reports:
          #
          #   31321721554  1a10fe2c  2026-08-09  37s  16.051s  233 tests  red
          #   33131888365  865eac3b  2026-08-28  34s  14.773s  284 tests  red
          #   33595667009  0193bb75  2026-09-02  31s  14.722s  284 tests  red
          #   33595188920  5abc17e5  2026-09-02  27s  14.575s  284 tests  green
          #
          # The last two differ by 0.147s in the thing the bound is about and by
          # four seconds in the thing it was comparing, and one of them merged
          # while the other did not. The oldest ran 233 tests in the LONGEST
          # test time of the four, so the number was not tracking the suite in
          # the other direction either: the suite has since grown by 51 tests
          # and got faster.
          #
          # It is a sum and not a wall time because packages run in parallel. A
          # wall time falls when the runner has more cores, which is not the
          # suite getting smaller, and rises when it has fewer. The sum does not
          # move for either reason, and it never under-reports.
          suite_ms_of() {
            awk -F'\t' '
              $1 == "ok  " && $3 ~ /^[0-9]+\.[0-9]+s$/ {
                n++; t = $3; sub(/s$/, "", t); ms += t * 1000
              }
              END { if (n == 0) print "none"; else printf "%d\n", ms }
            ' "$1"
          }

          bound_ms=$((SUITE_BOUND_SECONDS * 1000))

          verdict_of() {
            v=$(suite_ms_of "$1")
            if [ "$v" = "none" ] || [ "$v" -ge "$bound_ms" ]; then
              echo refused
            else
              echo allowed
            fi
          }

          # ---- the proof, run before this run is judged ---------------------
          #
          # A bound that has never refused anything is a green line with nothing
          # behind it, so the reading and the comparison are shown to say no and
          # to say yes against fabricated output first, through the same two
          # functions this run then goes through. The fixtures are near misses
          # rather than obvious violations: one millisecond either side of the
          # bound, and a pair of packages that each pass alone and do not pass
          # together, which is the one a maximum would walk straight through.
          #
          # EVERY FIXTURE TIME IS DERIVED FROM THE BOUND rather than written as
          # a number beside it. Written out, they prove the comparison at one
          # value of SUITE_BOUND_SECONDS and red for the wrong reason at every
          # other, so the first person to change that constant would meet a
          # proof failure about a fixture instead of a verdict about the suite.
          proof=0
          expect() {
            got=$(verdict_of "$2")
            if [ "$got" = "$1" ]; then
              echo "  proved $1: $3"
            else
              echo "  PROOF FAILED: $3 was $got, want $1"
              proof=1
            fi
          }

          ms_str() { printf '%d.%03d' "$(( $1 / 1000 ))" "$(( $1 % 1000 ))"; }

          fx=$(mktemp -d)
          half=$(( bound_ms / 2 + 1 ))
          printf 'ok  \tx/a\t%ss\n' "$(ms_str $(( bound_ms - 1 )))" > "$fx/under"
          printf 'ok  \tx/a\t%ss\n' "$(ms_str "$bound_ms")"         > "$fx/at"
          printf 'ok  \tx/a\t%ss\n' "$(ms_str "$half")"             > "$fx/half"
          printf 'ok  \tx/a\t%ss\nok  \tx/b\t%ss\n' \
            "$(ms_str "$half")" "$(ms_str "$half")"                 > "$fx/sum"
          printf '?   \tx/c\t[no test files]\n'                     > "$fx/none"
          printf 'ok  \tx/a\t%ss\nFAIL\tx/b\t%ss\n' \
            "$(ms_str "$half")" "$(ms_str $(( bound_ms * 10 )))"    > "$fx/failed"

          expect allowed "$fx/under"  "a suite one millisecond under the bound"
          expect refused "$fx/at"     "a suite exactly at the bound"
          expect allowed "$fx/half"   "one package at just over half the bound"
          expect refused "$fx/sum"    "two of that package, which pass alone and not together"
          expect refused "$fx/none"   "output carrying no package result line at all"
          expect allowed "$fx/failed" "that package beside a FAIL line ten times the bound, which is not suite time"
          rm -rf "$fx"

          if [ "$proof" -ne 0 ]; then
            echo "REFUSED: the duration bound did not prove it can say no, so this run's duration is not judged"
            exit 1
          fi

          # ---- the judgement ------------------------------------------------
          #
          # The bound is issue #24's and the number is unchanged. What changed is
          # what it is compared against, so the headroom is readable for the
          # first time: the largest test execution in the four runs above is
          # 16.051s and the bound is a little under twice it. The same suite sums
          # 21.703s on the workstation this change was written on, which is the
          # tighter of the two margins and is disclosed here rather than paid for
          # by raising the number. Raising it stays a decision somebody makes in
          # a commit rather than something that happens by accretion.
          suite_ms=$(suite_ms_of test-output.txt)
          if [ "$suite_ms" = "none" ]; then
            echo "REFUSED: no package result line was found in the output, so the suite's own duration could not be read"
            exit 1
          fi
          printf 'suite duration: %d.%03ds of test execution (bound %ss), inside %ss of go test invocation\n' \
            "$((suite_ms / 1000))" "$((suite_ms % 1000))" "$SUITE_BOUND_SECONDS" "$invocation"
          if [ "$suite_ms" -ge "$bound_ms" ]; then
            echo "REFUSED: the tests executed for $((suite_ms / 1000))s, at or over the ${SUITE_BOUND_SECONDS}s bound. This is the suite and not the runner: the invocation around it took ${invocation}s and the difference is the compile."
            exit 1
          fi
        env:
          SUITE_BOUND_SECONDS: 30
