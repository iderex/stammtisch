# The example configuration carries no secret, as a check rather than a habit.
#
# A configuration file is the thing people paste into a forum post, and an
# example that shows a secret written as a literal teaches every operator who
# copies it to write theirs the same way. Issue #66 asks for a check that
# refuses a literal that looks like a secret in the example configuration, and
# this is it.
#
# What it refuses, in the value position of a `key = value` line:
#
#   a key named for a secret that is not a -file reference
#       The convention this repository holds to is that a key needing a secret
#       takes the path of a file holding it and is named for that, so what is
#       in the configuration is a reference. A key called `token` with anything
#       after the = is a secret in the file; `token-file` is not.
#   a value beginning a PEM block
#       `-----BEGIN` is a private key pasted in whole, and it is the shape that
#       arrives when somebody is in a hurry.
#   an opaque value that is not a path
#       Thirty two characters or more of nothing but letters, digits and the
#       base64 punctuation, and not starting with / or ./, is what a minted
#       token looks like and what no key here has any use for.
#
# The last rule is the one with a false positive to give away, and the exclusion
# is the point rather than a softening: a long filesystem path is the value this
# configuration actually has, and a rule refusing it would be turned off within
# a week. The proof below spends a fixture on exactly that near miss.
#
# The rules read the value position only, so the word "secret" in a comment is
# left alone. That is not laxity: the example file explains the convention in
# its own comments, and a rule that refused prose about secrets would refuse the
# documentation of itself.
#
# It proves itself before it judges anything. The fixtures are built in a
# temporary directory, judged by the same function that judges the tree, and the
# run refuses unless every fault was caught and every near miss was left alone.
# So a run reporting a clean example is one in which the scan was shown able to
# say otherwise.
#
# It fails closed on the file list as well. The example is found by a pattern
# rather than named here, and a run that finds no example at all refuses, so
# renaming the file past this check reds instead of passing as clean.
#
# The whole of the check is in this file rather than in a script under
# `.github/`, for the same reason `invariants.yml` gives: issue #66 declares
# `.github/workflows/` in its Scope and a script beside the other two would be a
# path outside it.
#
# Hardened the same way as every other workflow here: read-only permissions at
# the top level, every action pinned by commit with a version comment, and
# checkout without persisted credentials.
name: Configuration secrets

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the job reads the tree and writes nothing back.
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one. Nothing here
# publishes, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run name is "Configuration secrets" and it is the literal name a
  # required status check would have to carry. Renaming this job renames the
  # check run and silently detaches it from any rule that requires it. Issue #25
  # is where that rule is asked for, and this comment is the record of the name
  # it would have to name.
  config-secrets:
    name: Configuration secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the scan refuses, then read the example configuration
        run: |
          set -eu

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # judge <file>. Prints one line per refusal and returns 1 if there was
          # any. One function judges the fixtures and the tree alike; what
          # differs between them is only which file it is pointed at.
          #
          # The length comparison is written out rather than as a repeat count,
          # because the interval form is not in every awk a runner might carry
          # and a rule that silently matches nothing is the failure this whole
          # file exists against.
          judge() {
            awk '
              {
                line = $0
                sub(/#.*/, "", line)
                gsub(/^[ \t]+|[ \t]+$/, "", line)
                if (line == "") next
                eq = index(line, "=")
                if (eq == 0) next

                key = substr(line, 1, eq - 1)
                val = substr(line, eq + 1)
                gsub(/^[ \t]+|[ \t]+$/, "", key)
                gsub(/^[ \t]+|[ \t]+$/, "", val)
                if (val == "") next

                if (key ~ /password|passwd|secret|token|apikey|api-key|credential|passphrase|private-key/ && key !~ /-file$/) {
                  printf "%s:%d: %s is named for a secret and is not a -file reference, so the value here is the secret itself\n", FILENAME, NR, key
                  bad = 1
                }
                if (val ~ /^-----BEGIN/) {
                  printf "%s:%d: %s begins a PEM block, which is a private key written into the file whole\n", FILENAME, NR, key
                  bad = 1
                }
                if (val !~ /^\.?\// && length(val) >= 32 && val ~ /^[A-Za-z0-9+\/=_-]+$/) {
                  printf "%s:%d: %s is %d opaque characters and is not a path, which is what a minted token looks like\n", FILENAME, NR, key, length(val)
                  bad = 1
                }
              }
              END { exit bad ? 1 : 0 }
            ' "$1"
          }

          # ---- the proof, run before the tree is read -----------------------

          proof_failures=0

          expect() {
            want=$1
            what=$2
            text=$3
            printf '%s\n' "$text" > "$work/fixture.txt"
            if judge "$work/fixture.txt" > "$work/said" 2>&1; then
              got=allowed
            else
              got=refused
            fi
            if [ "$got" = "$want" ]; then
              printf '  proved %s: %s\n' "$want" "$what"
            else
              printf '  PROOF FAILED: %s was %s\n' "$what" "$got"
              sed 's/^/              /' "$work/said"
              proof_failures=1
            fi
          }

          expect refused 'a key named for a secret carrying a literal' \
            'token = s3cr3t-value'
          expect allowed 'the same key as a -file reference beside it' \
            'token-file = /etc/stammtisch/token'
          expect refused 'a private key pasted in whole' \
            'store-path = -----BEGIN PRIVATE KEY-----'
          expect allowed 'a comment saying what a PEM block starts with' \
            '# a private key starts with -----BEGIN and never belongs here'
          expect refused 'an opaque value of the length a minted token has' \
            'store-path = QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTI='
          expect allowed 'a filesystem path longer than that, which is the near miss' \
            'store-path = /var/lib/stammtisch/a-long-directory-name/stammtisch.db'
          expect allowed 'the word secret in prose, which the example explains itself in' \
            '# no key here carries a secret and the format has no shape for one'

          if [ "$proof_failures" -ne 0 ]; then
            echo
            echo "REFUSED: the scan did not prove it can say no, so the tree is not read"
            exit 1
          fi

          # ---- the tree -----------------------------------------------------

          echo
          git ls-files 'docs/*.example.txt' > "$work/examples"
          if [ ! -s "$work/examples" ]; then
            echo "REFUSED: there is no example configuration under docs/ for this check to read"
            exit 1
          fi

          failed=0
          while read -r file; do
            if judge "$file"; then
              printf '  ok        %s carries no secret-shaped value\n' "$file"
            else
              failed=1
            fi
          done < "$work/examples"

          exit "$failed"
